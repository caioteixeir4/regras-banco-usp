services:
  # ---------------------------------------------------------
  # O Banco de Dados da Kawashi (Oracle Free Edition)
  # Responsável pelo armazenamento persistente dos dados e auditoria.
  # ---------------------------------------------------------
  oracle:
    image: gvenzl/oracle-free:latest # Imagem oficial e leve do Oracle para desenvolvimento.
    container_name: kawashi-oracle   # Nome fixo para facilitar a referência por outros serviços.
    ports:
      - "1521:1521"                  # Porta padrão do Oracle (Local:Container).
    environment:
      - ORACLE_PASSWORD=${ORACLE_PASSWORD}       # Senha do usuário SYS/SYSTEM (Admin Root do banco).
      # A imagem gvenzl/oracle-free exige que estas duas variaveis se chamem exatamente
      # APP_USER/APP_USER_PASSWORD DENTRO do container (contrato da propria imagem, nao
      # da Kawashi) - por isso a "ponte" abaixo: no nosso .env o nome e SPRING_APP_USER
      # (mais claro que e a conta do Spring Boot), mas repassamos pro container com o
      # nome que a imagem espera.
      - APP_USER=${SPRING_APP_USER}
      - APP_USER_PASSWORD=${SPRING_APP_USER_PASSWORD}
      - ENGINEER_USER=${ENGINEER_USER}           # Usuário pessoal do engenheiro do projeto (privilégio DBA).
      - ENGINEER_USER_PASSWORD=${ENGINEER_USER_PASSWORD}
    volumes:
      # Ponto de montagem para scripts de inicialização automática.
      # Qualquer arquivo .sql em ./oracle-init será executado no primeiro boot.
      - ./oracle-init:/container-entrypoint-initdb.d
    # O Oracle demora de 1 a 3+ minutos pra ficar pronto no primeiro boot (criando o banco,
    # depois rodando os 11 scripts de oracle-init). Sem isso, "docker compose up" parece
    # terminado mas o banco ainda nao aceita conexao - o healthcheck.sh ja vem pronto na
    # imagem gvenzl/oracle-free exatamente pra sinalizar esse estado.
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    networks:
      - kawashi-net # Conecta o banco à rede privada interna.
    # #########################################################################
    # 🔒 TODO SEGURANÇA PENDENTE - HARDENING DE REDE (nao ativo ainda)
    # #########################################################################
    # Criptografia em transito (SQLNET.ENCRYPTION) + bloqueio de reconfiguracao
    # remota do listener (ADMIN_RESTRICTIONS_LISTENER) ja estao PRONTOS pra
    # aplicar, mas de proposito NAO estao automatizados aqui - sao mudancas em
    # arquivo de rede do Oracle (sqlnet.ora/listener.ora), nao em SQL, e um erro
    # ali derruba o listener inteiro (pior que um bug de trigger).
    #
    # Conteudo pronto:  infra/oracle-network-config/*.append
    # Passo a passo:    infra/docs/hardening-rede.md
    #
    # Aplicar manualmente, e SO depois do ambiente ja ter subido limpo pelo
    # menos uma vez (verify-environment.ps1 sem erro). Nao esquecer.
    # #########################################################################

  # ---------------------------------------------------------
  # O Cofre da Kawashi (HashiCorp Vault)
  # Responsável pelo Secret Management: centraliza e protege senhas e chaves.
  # ---------------------------------------------------------
  vault:
    # ATENÇÃO: Fixado na 1.15.6 pois versões mais recentes (1.16+) utilizam
    # CAP_SETFCAP no entrypoint, capability não suportada pelo Docker Desktop
    # no Windows/WSL2, causando crash silencioso no boot do container.
    # Atualizar somente após confirmação de compatibilidade com o ambiente local.
    image: hashicorp/vault:1.15.6
    container_name: kawashi-vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_DEV_ROOT_TOKEN_ID}
      # CORRIGIDO (achado testando ao vivo): o modo -dev sobe em HTTP puro, sem
      # TLS, mas o CLI "vault" por padrao assume HTTPS (https://127.0.0.1:8200)
      # quando VAULT_ADDR nao esta definida - toda chamada via docker exec vault
      # falhava com "server gave HTTP response to HTTPS client". Definindo aqui
      # no proprio container, todo `docker exec kawashi-vault vault ...` (nos
      # scripts create-team-member.ps1 e vault-init.ps1) ja usa o endereco certo
      # sem precisar repetir isso em cada chamada.
      - VAULT_ADDR=http://127.0.0.1:8200
    command: server -dev -dev-listen-address="0.0.0.0:8200"
    restart: unless-stopped
    networks:
      - kawashi-net

# ---------------------------------------------------------
# Rede Privada (Bridge)
# Garante que os serviços se enxerguem pelo nome do container (DNS interno).
# ---------------------------------------------------------
networks:
  kawashi-net:
    driver: bridge
